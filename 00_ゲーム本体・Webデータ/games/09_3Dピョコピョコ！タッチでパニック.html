            touch-action: none;

            box-shadow: 0 4px 0 #b45309, 0 6px 12px rgba(0,0,0,0.22);

            transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 0 #334155, 0 6px 12px rgba(0,0,0,0.22);
            transform: translateY(0);
        }
        .btn-toy-slate:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #334155, 0 2px 4px rgba(0,0,0,0.18);
        }

        @keyframes pulseGentle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.025); }
        }
        .guide-pulse {
            animation: pulseGentle 2.2s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.38); opacity: 0; }
            70% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-pop {
            animation: popIn 0.36s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* スコアポップアニメーション */
        @keyframes scoreBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        .score-bump {
            animation: scoreBump 0.22s ease-out;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

            background: #fef3c7;
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 9999px;
        }
    </style>
</head>

    <script>
        /* ==========================================
         * 1. サウンドエンジン (Web Audio API)
         * ピョコッ出現音・ピコピコハンマー打撃音・コンボ音・終了ファンファーレ
         * ========================================== */
        class WhackSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 穴から「ピョコッ♪」と顔を出す音
            playPopUp() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(560, now + 0.09);

                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.11);
            }

            // タッチ成功時の「ピコッ！ポヨン♪」音（コンボが続くほど音程が上がる）
            playHitSuccess(combo = 1) {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                // 1音目：ピコハンマーのキュートなアタック音
                const osc1 = this.ctx.createOscillator();
                const gain1 = this.ctx.createGain();
                const baseFreq = 523.25 * Math.pow(1.06, Math.min(combo, 12));
                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(baseFreq, now);
                osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.11);
                gain1.gain.setValueAtTime(0.32, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                osc1.connect(gain1);
                gain1.connect(this.ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.17);

                // 2音目：キラキラ余韻音
                const osc2 = this.ctx.createOscillator();
                const gain2 = this.ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(baseFreq * 1.5, now + 0.06);
                osc2.frequency.exponentialRampToValueAtTime(baseFreq * 2.0, now + 0.18);
                gain2.gain.setValueAtTime(0.22, now + 0.06);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc2.connect(gain2);
                gain2.connect(this.ctx.destination);
                osc2.start(now + 0.06);
                osc2.stop(now + 0.23);
            }

            playFriendlyWave() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.08);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.21);
            }

            // リセット・設定変更時のシャラン音
            playReset() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((f, i) => {
                    const now = this.ctx.currentTime + i * 0.045;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                });
            }

            // タイムアップ時のファンファーレ
            playFinishFanfare() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                const durations = [0.12, 0.12, 0.12, 0.22, 0.12, 0.48];
                let offset = 0;
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + offset;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + durations[idx]);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + durations[idx] + 0.02);
                    offset += durations[idx] * 0.95;
                });
            }
        }

         * ========================================== */
        let scene, camera, renderer;

        let hitTargetMeshes = [];      // Raycaster用の大きめ当たり判定メッシュ
        let hammerGroup = null;        // 3Dピコピコハンマー

        let currentBoardSpanW = 8.8;
        let currentBoardSpanH = 6.4;

        // ドラッグでボード角度を少し変えられる機能
        let isDragging = false;
        let dragStartPos = { x: 0, y: 0 };
        let previousPointerPos = { x: 0, y: 0 };
        let targetBoardRotation = { x: -0.38, y: 0 };

        // ハンマーアニメーション制御
        let hammerAnim = {
            active: false,
            progress: 0
        };

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || (window.innerHeight - 170);

            camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 明るく立体感のあるライティング
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.84);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
            dirLight.position.set(6, 12, 11);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            const d = 9.5;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const rimLight = new THREE.DirectionalLight(0xfde047, 0.32);
            rimLight.position.set(-8, -6, 6);
            scene.add(rimLight);

            boardGroup = new THREE.Group();
            boardGroup.rotation.x = targetBoardRotation.x;
            boardGroup.rotation.y = targetBoardRotation.y;
            scene.add(boardGroup);

            buildWhackStageAndStart();
            updateCameraAndRendererSize();

            window.addEventListener('resize', updateCameraAndRendererSize);
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => updateCameraAndRendererSize());
                ro.observe(container);
            }

            setupPointerInteractions(renderer.domElement);
        }

        // #canvas-container の実寸に合わせて、3Dステージ全体が文字や枠外と重ならないようカメラ距離を自動調整
        function updateCameraAndRendererSize() {
            if (!camera || !renderer) return;
            const container = document.getElementById('canvas-container');
            const w = Math.max(100, container.clientWidth);
            const h = Math.max(100, container.clientHeight);

            renderer.setSize(w, h);
            const aspect = w / h;
            camera.aspect = aspect;

            const fovRad = THREE.MathUtils.degToRad(camera.fov);
            const padW = currentBoardSpanW + 1.6;
            const padH = currentBoardSpanH + 2.1; // 上段の穴から飛び出すキャラとハンマーの頭上余白を確保

            const distV = (padH / 2) / Math.tan(fovRad / 2);
            const distH = (padW / 2) / (Math.tan(fovRad / 2) * aspect);

            const finalDist = Math.max(distV, distH, 10.2);
            camera.position.set(0, -0.15, finalDist);
            camera.lookAt(0, 0.1, 0);
            camera.updateProjectionMatrix();
        }

        // ステージ盤面・穴・ピョコピョコドール・3Dピコピコハンマーを構築してゲーム開始
        function buildWhackStageAndStart() {
            while (boardGroup.children.length > 0) {
                boardGroup.remove(boardGroup.children[0]);
            }
            holeSlots = [];
            hitTargetMeshes = [];
            starParticles = [];

            score = 0;
            combo = 0;
            timeLeft = timeLimitSetting;
            isGameOver = false;
            spawnTimer = 0.25;
            countdownAccumulator = 0;

            document.getElementById('result-overlay').classList.add('hidden');
            document.getElementById('hit-feedback-layer').innerHTML = '';

            // おだいタッチモードの初期ターゲット選出
            pickNewTargetCharacter();

            // グリッド構成（6穴 = 3列×2行、9穴 = 3列×3行）
            const cols = 3;
            const rows = holeCount === 6 ? 2 : 3;
            const spacingX = 2.45;
            const spacingY = 2.25;

            const boardInnerW = cols * spacingX + 0.6;
            const boardInnerH = rows * spacingY + 0.6;
            const boardOuterW = boardInnerW + 0.7;
            const boardOuterH = boardInnerH + 0.7;

            currentBoardSpanW = boardOuterW;
            currentBoardSpanH = boardOuterH;

            // テーマ別カラー設定
            const palette = {
                bakery:   { outer: 0xb45309, inner: 0xfde68a, rim: 0xdc2626, rimTop: 0xfef3c7, pin: 0xfacc15 },
                forest:   { outer: 0x78350f, inner: 0x4ade80, rim: 0x92400e, rimTop: 0xd97706, pin: 0xf43f5e },
                aquarium: { outer: 0x0369a1, inner: 0x38bdf8, rim: 0x0284c7, rimTop: 0xf472b6, pin: 0xfef08a }
            }[currentTheme];

            // 1. 外枠立体ボード（厚みのあるボックスで下から飛び出すキャラの胴体を自然に隠す）
            const outerMesh = new THREE.Mesh(
                new THREE.BoxGeometry(boardOuterW, boardOuterH, 1.35),
                new THREE.MeshStandardMaterial({ color: palette.outer, roughness: 0.4 })
            );
            outerMesh.position.z = -0.72;
            outerMesh.receiveShadow = true;
            boardGroup.add(outerMesh);

            // 2. 内側盤面プレート
            const innerMesh = new THREE.Mesh(
                new THREE.BoxGeometry(boardInnerW, boardInnerH, 1.28),
                new THREE.MeshStandardMaterial({ color: palette.inner, roughness: 0.45 })
            );
            innerMesh.position.z = -0.64;
            innerMesh.receiveShadow = true;
            boardGroup.add(innerMesh);

            // 四隅の飾りモチーフ
            const pinGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.3, 20);
            pinGeo.rotateX(Math.PI / 2);
            const pinMat = new THREE.MeshStandardMaterial({ color: palette.pin, roughness: 0.25 });
            const px = boardOuterW / 2 - 0.38;
            const py = boardOuterH / 2 - 0.38;
            [[-px, -py], [px, -py], [-px, py], [px, py]].forEach(([cx, cy]) => {
                const pin = new THREE.Mesh(pinGeo, pinMat);
                pin.position.set(cx, cy, 0.05);
                boardGroup.add(pin);
            });

            // 3. 各穴（煙突・切り株・サンゴ穴）とピョコピョコドールの作成
            for (let i = 0; i < holeCount; i++) {
                const r = Math.floor(i / cols);
                const c = i % cols;
                const x = (c - (cols - 1) / 2) * spacingX;
                const y = ((rows - 1) / 2 - r) * spacingY;

                createHoleAndPuppetSlot(i, x, y, palette);
            }

            // 4. 3Dピコピコハンマーを作成
            create3DPikoHammer();

            updateCameraAndRendererSize();
            updateHeaderAndGuideUI();
        }

        function createHoleAndPuppetSlot(index, x, y, palette) {
            const slotGroup = new THREE.Group();
            slotGroup.position.set(x, y, 0);
            boardGroup.add(slotGroup);

            // ① 穴の外周リング（煙突・切り株・サンゴの筒）
            const rimOuter = new THREE.Mesh(
                new THREE.CylinderGeometry(0.92, 0.98, 0.42, 32),
                new THREE.MeshStandardMaterial({ color: palette.rim, roughness: 0.35 })
            );
            rimOuter.rotation.x = Math.PI / 2;
            rimOuter.position.z = 0.16;
            rimOuter.castShadow = true;
            rimOuter.receiveShadow = true;
            slotGroup.add(rimOuter);

            // 穴のフチの明るいリング
            const rimLip = new THREE.Mesh(
                new THREE.TorusGeometry(0.86, 0.09, 14, 32),
                new THREE.MeshStandardMaterial({ color: palette.rimTop, roughness: 0.3 })
            );
            rimLip.position.z = 0.37;
            slotGroup.add(rimLip);

            // ② 穴の奥の暗いサークル（奥行き感を表現）
            const darkPit = new THREE.Mesh(
                new THREE.CircleGeometry(0.82, 32),
                new THREE.MeshBasicMaterial({ color: 0x0f172a })
            );
            darkPit.position.z = 0.36;
            slotGroup.add(darkPit);

            // ③ 穴からピョコッと飛び出す3Dキャラクタードールグループ
            const puppetGroup = new THREE.Group();
            // 待機時は穴の奥(-Z)に隠れている
            puppetGroup.position.set(0, 0, -0.75);
            slotGroup.add(puppetGroup);

            // ドールのカラフルな胴体カプセル
            const bodyMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.52, 0.62, 0.75, 24),
                new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 })
            );
            bodyMesh.rotation.x = Math.PI / 2;
            bodyMesh.position.set(0, -0.15, -0.2);
            puppetGroup.add(bodyMesh);

            // ドールの丸い3Dメダル顔（正面に高解像度イラスト）
            const headGeo = new THREE.CylinderGeometry(0.74, 0.74, 0.28, 36);
            headGeo.rotateX(Math.PI / 2);
            headGeo.rotateZ(Math.PI / 2);

            const headRimMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
            const headFaceMat = new THREE.MeshStandardMaterial({
                map: getCharTexture('anpanman'),
                roughness: 0.22
            });

            const headMesh = new THREE.Mesh(headGeo, [headRimMat, headFaceMat, headFaceMat]);
            headMesh.position.set(0, 0.12, 0.12);
            headMesh.rotation.x = 0.32; // カメラに向けて見やすく角度をつける
            headMesh.castShadow = true;
            puppetGroup.add(headMesh);

            // ④ タップ判定用の透明な大きめヒットボックス（2歳のお子様が少しズレて触っても反応する優しい設計）
            const hitBox = new THREE.Mesh(
                new THREE.CylinderGeometry(1.08, 1.08, 1.8, 16),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            hitBox.rotation.x = Math.PI / 2;
            hitBox.position.set(x, y, 0.65);
            hitBox.userData = { holeIndex: index };
            boardGroup.add(hitBox);
            hitTargetMeshes.push(hitBox);

            holeSlots.push({
                index,
                x,
                y,
                state: 'hidden', // 'hidden' | 'popping' | 'active' | 'hit' | 'retreating'
                charId: 'anpanman',
                timer: 0,
                stayDuration: 2.0,
                hiddenZ: -0.75,
                poppedZ: 0.88,
                currentZ: -0.75,
                puppetGroup,
                bodyMesh,
                headMesh,
                rimLip
            });
        }

        // タッチした穴の上で「ピコッ！」と振られるかわいい3Dピコピコハンマー
        function create3DPikoHammer() {
            hammerGroup = new THREE.Group();
            hammerGroup.visible = false;
            boardGroup.add(hammerGroup);

            // 白と水色の持ち手
            const handle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.11, 0.13, 1.35, 16),
                new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.25 })
            );
            handle.position.set(0, 0.65, 0);
            hammerGroup.add(handle);

            // 赤いハンマーヘッド
            const head = new THREE.Mesh(
                new THREE.CylinderGeometry(0.38, 0.38, 1.05, 24),
                new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.25 })
            );
            head.rotation.z = Math.PI / 2;
            head.position.set(0, 1.25, 0);
            hammerGroup.add(head);

            // 両端の黄色い蛇腹クッション
            [-0.54, 0.54].forEach(ox => {
                const cap = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.42, 0.42, 0.16, 24),
                    new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.2 })
                );
                cap.rotation.z = Math.PI / 2;
                cap.position.set(ox, 1.25, 0);
                hammerGroup.add(cap);
            });
        }

        function triggerHammerSwingAt(x, y) {
            if (!hammerGroup) return;
            hammerGroup.visible = true;
            hammerGroup.position.set(x + 0.65, y - 0.35, 1.45);
            hammerGroup.rotation.set(0.2, 0, -0.5);
            hammerAnim.active = true;
            hammerAnim.progress = 0;
        }

        /* ==========================================
         * 6. キャラクター出現ロジック＆タップ判定
         * ========================================== */
        function getThemeCharacterList() {
            return Object.keys(CHARACTER_CATALOG).filter(k => CHARACTER_CATALOG[k].theme === currentTheme);
        }

        function pickNewTargetCharacter() {
            const list = getThemeCharacterList();
            const prev = currentTargetCharId;
            const candidates = list.filter(k => k !== prev);
            currentTargetCharId = candidates[Math.floor(Math.random() * candidates.length)] || list[0];
        }

        // スピード設定に応じたパラメータを取得
        function getSpeedConfig() {
            if (speedMode === 'slow') {
                return { stayMin: 2.3, stayMax: 3.1, spawnInterval: 0.75, maxActive: Math.ceil(holeCount * 0.55) };
            }
            if (speedMode === 'normal') {
                return { stayMin: 1.5, stayMax: 2.2, spawnInterval: 0.55, maxActive: Math.ceil(holeCount * 0.65) };
            }
            return { stayMin: 1.0, stayMax: 1.5, spawnInterval: 0.38, maxActive: Math.ceil(holeCount * 0.75) };
        }

        function trySpawnCharacter() {
            if (isGameOver || isSettingsOpen) return;
            const cfg = getSpeedConfig();

            const activeSlots = holeSlots.filter(s => s.state !== 'hidden');
            if (activeSlots.length >= cfg.maxActive) return;

            const hiddenSlots = holeSlots.filter(s => s.state === 'hidden');
            if (hiddenSlots.length === 0) return;

            const slot = hiddenSlots[Math.floor(Math.random() * hiddenSlots.length)];

            // モードに合わせて出現させるキャラクターを選出
            const themeKeys = getThemeCharacterList();
            let chosenId = themeKeys[0];

            if (gameMode === 'any') {
                chosenId = themeKeys[Math.floor(Math.random() * themeKeys.length)];
            } else if (gameMode === 'mischief') {
                // 75%の確率でいたずらっこキャラを出し、25%で味方キャラを出す（お子様がテンポよくタッチできるように）
                const mischiefs = themeKeys.filter(k => CHARACTER_CATALOG[k].isMischief);
                const friends = themeKeys.filter(k => !CHARACTER_CATALOG[k].isMischief);
                if (Math.random() < 0.75 || friends.length === 0) {
                    chosenId = mischiefs[Math.floor(Math.random() * mischiefs.length)];
                } else {
                    chosenId = friends[Math.floor(Math.random() * friends.length)];
                }
            } else if (gameMode === 'target') {
                // 65%の確率でお手本キャラを出す
                if (Math.random() < 0.65) {
                    chosenId = currentTargetCharId;
                } else {
                    chosenId = themeKeys[Math.floor(Math.random() * themeKeys.length)];
                }
            }

            const charInfo = CHARACTER_CATALOG[chosenId];
            slot.charId = chosenId;
            slot.state = 'popping';
            slot.timer = 0;
            slot.stayDuration = cfg.stayMin + Math.random() * (cfg.stayMax - cfg.stayMin);

            // テクスチャと胴体カラーをセット
            slot.bodyMesh.material.color.setHex(charInfo.bodyHex);
            slot.headMesh.material[1].map = getCharTexture(chosenId);
            slot.headMesh.material[1].needsUpdate = true;
            slot.headMesh.material[2].map = getCharTexture(chosenId);
            slot.headMesh.material[2].needsUpdate = true;

            // ターゲットの穴のフチを光らせてわかりやすくする
            const isTarget = isCharValidTarget(chosenId);
            slot.rimLip.material.emissive.setHex(isTarget ? 0xfacc15 : 0x000000);
            slot.rimLip.material.emissiveIntensity = isTarget ? 0.35 : 0;

            slot.puppetGroup.scale.set(1, 1, 1);
            slot.puppetGroup.rotation.set(0, 0, 0);
            sound.playPopUp();
        }

        function isCharValidTarget(charId) {
            if (gameMode === 'any') return true;
            if (gameMode === 'mischief') return CHARACTER_CATALOG[charId].isMischief;
            if (gameMode === 'target') return charId === currentTargetCharId;
            return true;
        }

        // ポインター＆タップ処理
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function setupPointerInteractions(domElement) {
            domElement.addEventListener('pointerdown', (e) => {
                sound.init();
                isDragging = true;
                dragStartPos.x = e.clientX;
                dragStartPos.y = e.clientY;
                previousPointerPos.x = e.clientX;
                previousPointerPos.y = e.clientY;

                // アクションゲームなので pointerdown の瞬間に即座にタッチ判定を行う（レスポンス抜群！）
                handleStageTap(e.clientX, e.clientY);
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - previousPointerPos.x;
                const dy = e.clientY - previousPointerPos.y;
                previousPointerPos.x = e.clientX;
                previousPointerPos.y = e.clientY;

                targetBoardRotation.y = Math.max(-0.38, Math.min(0.38, targetBoardRotation.y + dx * 0.005));
                targetBoardRotation.x = Math.max(-0.62, Math.min(-0.12, targetBoardRotation.x + dy * 0.005));
            });

            window.addEventListener('pointerup', () => {
                isDragging = false;
            });
        }

        function handleStageTap(clientX, clientY) {
            if (isGameOver || isSettingsOpen) return;

            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(hitTargetMeshes);

            if (intersects.length > 0) {
                // 顔を出している穴を優先してヒットさせる
                for (const hit of intersects) {
                    const idx = hit.object.userData.holeIndex;
                    const slot = holeSlots[idx];
                    if (slot.state === 'popping' || slot.state === 'active') {
                        onPuppetTapped(slot, clientX, clientY);
                        return;
                    }
                }
            }
        }

        function onPuppetTapped(slot, screenX, screenY) {
            const valid = isCharValidTarget(slot.charId);
            const charInfo = CHARACTER_CATALOG[slot.charId];

            if (valid) {
                // 🌟 タッチ大成功！
                slot.state = 'hit';
                slot.timer = 0;
                slot.rimLip.material.emissiveIntensity = 0;

                score++;
                combo++;
                sound.playHitSuccess(combo);

                // スコアバッジを弾ませる
                const scoreEl = document.getElementById('score-val');
                scoreEl.textContent = score;
                scoreEl.classList.remove('score-bump');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('score-bump');

                document.getElementById('combo-val').textContent = combo;

                // 3Dハンマー演出＆星パーティクル＆フローティング文字
                triggerHammerSwingAt(slot.x, slot.y);
                spawnHitStars(slot.x, slot.y);
                const praises = ['やったね！', 'ナイス！', 'すごい！', 'ピコッ！✨'];
                showFloatingText(screenX, screenY, `🌟 ${praises[score % praises.length]} +1`, 'text-red-600 border-amber-400');

                // おだいタッチモードなら3回タッチ成功ごとにお手本をチェンジ
                if (gameMode === 'target') {
                    targetHitsCounter++;
                    if (targetHitsCounter >= 3) {
                        targetHitsCounter = 0;
                        pickNewTargetCharacter();
                        updateHeaderAndGuideUI();
                    }
                }
            } else {
                // 😊 いたずらっこモード等で味方キャラをタッチしたとき（減点せず優しくガイド）
                slot.state = 'retreating';
                slot.timer = 0;
                combo = 0;
                document.getElementById('combo-val').textContent = 0;
                sound.playFriendlyWave();
                showFloatingText(screenX, screenY, `😊 ${charInfo.name}は おともだち♪`, 'text-sky-700 border-sky-400');
            }
        }

        function showFloatingText(clientX, clientY, text, colorClasses) {
            const layer = document.getElementById('hit-feedback-layer');
            const rect = layer.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const badge = document.createElement('div');
            badge.className = `modal-pop absolute bg-white/95 px-3 py-1 rounded-full border-2 shadow-lg font-black text-xs sm:text-sm whitespace-nowrap ${colorClasses}`;
            badge.style.left = `${Math.max(20, Math.min(rect.width - 140, x - 55))}px`;
            badge.style.top = `${Math.max(15, y - 35)}px`;
            badge.textContent = text;
            layer.appendChild(badge);

            setTimeout(() => {
                badge.style.transition = 'all 0.35s ease';
                badge.style.opacity = '0';
                badge.style.transform = 'translateY(-22px) scale(0.9)';
                setTimeout(() => badge.remove(), 350);
            }, 650);
        }

        function spawnHitStars(x, y) {
            const colors = [0xfacc15, 0xef4444, 0x38bdf8, 0x4ade80, 0xf472b6, 0xffffff];
            const geo = new THREE.OctahedronGeometry(0.18, 0);

            for (let i = 0; i < 14; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length] });
                const star = new THREE.Mesh(geo, mat);
                star.position.set(x, y, 0.9);
                const angle = (Math.PI * 2 * i) / 14;
                const speed = 0.05 + Math.random() * 0.06;
                star.userData = {
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    vz: 0.05 + Math.random() * 0.05,
                    life: 32
                };
                boardGroup.add(star);
                starParticles.push(star);
            }
        }

        /* ==========================================
         * 7. タイムアップ＆結果発表演出
         * ========================================== */
        function triggerTimeUp() {
            isGameOver = true;
            sound.playFinishFanfare();

            // すべてのキャラクターを引っ込める
            holeSlots.forEach(s => {
                if (s.state !== 'hidden') {
                    s.state = 'retreating';
                }
                s.rimLip.material.emissiveIntensity = 0;
            });

            // 祝福の星シャワー
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    spawnHitStars((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 3);
                }, i * 150);
            }

            const overlay = document.getElementById('result-overlay');
            document.getElementById('result-title').textContent = `${score}かい タッチ！`;
            const subEl = document.getElementById('result-subtitle');
            if (score >= 20) {
                subEl.textContent = 'すごすぎる！！ タッチの名人だね！👑✨';
            } else if (score >= 10) {
                subEl.textContent = 'やったね！ いっぱいタッチできたよ！🎉';
            } else {
                subEl.textContent = 'たのしかったね！ もう1回あそんでみよう♪';
            }

            document.getElementById('guide-text').textContent = `🎊 おしまい！ ${score}かい タッチできたよ！ 🎊`;
            overlay.classList.remove('hidden');
        }

        /* ==========================================
         * 8. ヘッダーUI・お手本バナー・設定モーダル更新
         * ========================================== */
        function updateHeaderAndGuideUI() {
            document.body.className = `bg-${currentTheme}`;

            document.getElementById('score-val').textContent = score;
            document.getElementById('combo-val').textContent = combo;
            document.getElementById('timer-val').textContent = timeLimitSetting === 0 ? '∞' : timeLeft;

            const iconsWrap = document.getElementById('guide-icons-wrap');
            const guideText = document.getElementById('guide-text');
            iconsWrap.innerHTML = '';

            const themeKeys = getThemeCharacterList();

            if (gameMode === 'any') {
                // テーマの代表キャラ2つを表示
                themeKeys.slice(0, 2).forEach(k => {
                    iconsWrap.appendChild(createMiniGuideIcon(k));
                });
                guideText.textContent = 'ピョコッとでてきた仲間を タッチしてね！';
                guideText.className = 'text-xs sm:text-sm font-black text-red-600 truncate';
            } else if (gameMode === 'mischief') {
                const mischiefs = themeKeys.filter(k => CHARACTER_CATALOG[k].isMischief);
                mischiefs.forEach(k => {
                    iconsWrap.appendChild(createMiniGuideIcon(k));
                });
                const names = mischiefs.slice(0, 2).map(k => CHARACTER_CATALOG[k].name).join('・');
                guideText.textContent = `いたずらっこ（${names}）をタッチしてね！`;
                guideText.className = 'text-xs sm:text-sm font-black text-purple-700 truncate';
            } else if (gameMode === 'target') {
                iconsWrap.appendChild(createMiniGuideIcon(currentTargetCharId));
                const tName = CHARACTER_CATALOG[currentTargetCharId].name;
                guideText.textContent = `おだい：「${tName}」をさがしてタッチ！`;
                guideText.className = 'text-xs sm:text-sm font-black text-amber-800 truncate';
            }
        }

        function createMiniGuideIcon(charId) {
            const wrap = document.createElement('div');
            wrap.className = 'w-6 h-6 sm:w-7 sm:h-7 rounded-full border-2 border-amber-400 overflow-hidden bg-white shadow-sm flex-shrink-0';
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            c.className = 'w-full h-full';
            c.getContext('2d').drawImage(getCharIconCanvas(charId), 0, 0, 64, 64);
            wrap.appendChild(c);
            return wrap;
        }

        function renderSettingsModalUI() {
            // 1. モードボタン
            ['any', 'mischief', 'target'].forEach(md => {
                const btn = document.getElementById(`mode-btn-${md}`);
                if (gameMode === md) {
                    btn.className = 'p-2.5 rounded-xl font-black text-xs cursor-pointer bg-red-100 text-red-950 border-3 border-red-500 shadow-inner flex flex-col items-start text-left scale-[1.02]';
                } else {
                    btn.className = 'p-2.5 rounded-xl font-black text-xs cursor-pointer bg-slate-50 text-slate-700 border-2 border-slate-200 hover:bg-red-50 flex flex-col items-start text-left';
                }
            });

            // 2. テーマボタン
            ['bakery', 'forest', 'aquarium'].forEach(th => {
                const btn = document.getElementById(`theme-btn-${th}`);
                if (currentTheme === th) {
                    btn.className = 'p-2.5 rounded-xl font-black text-xs cursor-pointer bg-amber-100 text-amber-950 border-3 border-amber-500 shadow-inner flex items-center gap-2 text-left scale-[1.02]';
                } else {
                    btn.className = 'p-2.5 rounded-xl font-black text-xs cursor-pointer bg-slate-50 text-slate-700 border-2 border-slate-200 hover:bg-amber-50 flex items-center gap-2 text-left';
                }
            });

            // 3. スピードボタン
            ['slow', 'normal', 'fast'].forEach(sp => {
                const btn = document.getElementById(`speed-btn-${sp}`);
                if (speedMode === sp) {
                    btn.className = 'py-2 px-2 rounded-xl font-black text-xs cursor-pointer bg-emerald-500 text-white shadow border-2 border-emerald-700 flex flex-col items-center scale-105';
                } else {
                    btn.className = 'py-2 px-2 rounded-xl font-black text-xs cursor-pointer bg-emerald-50 text-emerald-950 border-2 border-emerald-200 hover:bg-emerald-100 flex flex-col items-center';
                }
            });

            // 4. 穴の数ボタン
            [6, 9].forEach(hc => {
                const btn = document.getElementById(`holes-btn-${hc}`);
                if (holeCount === hc) {
                    btn.className = 'py-2 px-2 rounded-xl font-black text-xs cursor-pointer bg-sky-500 text-white shadow border-2 border-sky-700';
                } else {
                    btn.className = 'py-2 px-2 rounded-xl font-black text-xs cursor-pointer bg-sky-50 text-sky-950 border-2 border-sky-200 hover:bg-sky-100';
                }
            });

            // 5. 時間ボタン
            [30, 45, 0].forEach(tm => {
                const btn = document.getElementById(`time-btn-${tm}`);
                if (timeLimitSetting === tm) {
                    btn.className = 'py-2 px-1 rounded-xl font-black text-xs cursor-pointer bg-purple-600 text-white shadow border-2 border-purple-800';
                } else {
                    btn.className = 'py-2 px-1 rounded-xl font-black text-xs cursor-pointer bg-purple-50 text-purple-950 border-2 border-purple-200 hover:bg-purple-100';
                }
            });

            // 6. サウンドボタン
            const soundBtn = document.getElementById('setting-sound-btn');
            soundBtn.textContent = sound.enabled ? '🔊 ON' : '🔇 OFF';
            soundBtn.className = sound.enabled
                ? 'bg-amber-500 hover:bg-amber-400 px-4 py-2 rounded-xl font-black text-xs sm:text-sm text-white shadow cursor-pointer flex-shrink-0 ml-2'
                : 'bg-slate-400 hover:bg-slate-500 px-4 py-2 rounded-xl font-black text-xs sm:text-sm text-white shadow cursor-pointer flex-shrink-0 ml-2';
        }

        // 設定変更ハンドラ群
        window.changeGameMode = function(newMode) {
            gameMode = newMode;
            pickNewTargetCharacter();
            sound.playReset();
            updateHeaderAndGuideUI();
            renderSettingsModalUI();
        };

        window.changeTheme = function(newTheme) {
            if (currentTheme === newTheme) return;
            currentTheme = newTheme;
            sound.playReset();
            renderSettingsModalUI();
            buildWhackStageAndStart();
        };

        window.changeSpeed = function(newSpeed) {
            speedMode = newSpeed;
            sound.playPopUp();
            renderSettingsModalUI();
        };

        window.changeHoleCount = function(newCount) {
            if (holeCount === newCount) return;
            holeCount = newCount;
            sound.playReset();
            renderSettingsModalUI();
            buildWhackStageAndStart();
        };

        window.changeTimeLimit = function(newTime) {
            timeLimitSetting = newTime;
            sound.playReset();
            renderSettingsModalUI();
            buildWhackStageAndStart();
        };

        window.resetGame = function() {
            sound.playReset();
            targetBoardRotation.x = -0.38;
            targetBoardRotation.y = 0;
            buildWhackStageAndStart();
        };

        /* ==========================================
         * 9. メイン60fpsアニメーションループ
         * ========================================== */
        const clock = new THREE.Clock();
        let prevTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            const dt = Math.min(0.1, elapsedTime - prevTime);
            prevTime = elapsedTime;

            // 1. ボード角度の滑らかな追従
            if (boardGroup) {
                boardGroup.rotation.x += (targetBoardRotation.x - boardGroup.rotation.x) * 0.12;
                boardGroup.rotation.y += (targetBoardRotation.y - boardGroup.rotation.y) * 0.12;
            }

            // 2. ゲーム進行（スポーンタイマー＆カウントダウン）
            if (!isGameOver && !isSettingsOpen) {
                const cfg = getSpeedConfig();
                spawnTimer -= dt;
                if (spawnTimer <= 0) {
                    trySpawnCharacter();
                    spawnTimer = cfg.spawnInterval * (0.75 + Math.random() * 0.5);
                }

                if (timeLimitSetting > 0) {
                    countdownAccumulator += dt;
                    if (countdownAccumulator >= 1.0) {
                        countdownAccumulator -= 1.0;
                        timeLeft = Math.max(0, timeLeft - 1);
                        document.getElementById('timer-val').textContent = timeLeft;
                        if (timeLeft <= 0) {
                            triggerTimeUp();
                        }
                    }
                }
            }

            // 3. 各穴のキャラクターのピョコピョコ昇降・揺れ・ヒットリアクション
            holeSlots.forEach((slot, idx) => {
                const pg = slot.puppetGroup;

                if (slot.state === 'popping') {
                    slot.currentZ += (slot.poppedZ - slot.currentZ) * 0.25;
                    pg.position.z = slot.currentZ;
                    if (Math.abs(slot.poppedZ - slot.currentZ) < 0.03) {
                        slot.currentZ = slot.poppedZ;
                        slot.state = 'active';
                        slot.timer = 0;
                    }
                } else if (slot.state === 'active') {
                    slot.timer += dt;
                    // 顔を出している間、左右にご機嫌に揺れる
                    pg.rotation.z = Math.sin(elapsedTime * 7 + idx) * 0.12;
                    pg.position.z = slot.poppedZ + Math.sin(elapsedTime * 5 + idx) * 0.05;

                    if (!isSettingsOpen && slot.timer >= slot.stayDuration) {
                        slot.state = 'retreating';
                        slot.rimLip.material.emissiveIntensity = 0;
                    }
                } else if (slot.state === 'hit') {
                    // タッチされた瞬間：ぷるんと弾んでくるっと回りながら穴へ戻る
                    slot.timer += dt;
                    pg.rotation.y += 0.45;
                    const squash = 1 + Math.sin(slot.timer * 25) * 0.22;
                    pg.scale.set(squash, 1 / squash, 1);

                    if (slot.timer > 0.28) {
                        slot.currentZ += (slot.hiddenZ - slot.currentZ) * 0.28;
                        pg.position.z = slot.currentZ;
                        if (slot.currentZ <= slot.hiddenZ + 0.05) {
                            slot.state = 'hidden';
                            slot.currentZ = slot.hiddenZ;
                            pg.position.z = slot.hiddenZ;
                            pg.scale.set(1, 1, 1);
                            pg.rotation.set(0, 0, 0);
                        }
                    }
                } else if (slot.state === 'retreating') {
                    slot.currentZ += (slot.hiddenZ - slot.currentZ) * 0.22;
                    pg.position.z = slot.currentZ;
                    pg.rotation.z *= 0.8;
                    if (slot.currentZ <= slot.hiddenZ + 0.04) {
                        slot.state = 'hidden';
                        slot.currentZ = slot.hiddenZ;
                        pg.position.z = slot.hiddenZ;
                        pg.rotation.set(0, 0, 0);
                    }
                }
            });

            // 4. 3Dピコピコハンマーのスイングアニメーション
            if (hammerAnim.active && hammerGroup) {
                hammerAnim.progress += dt * 4.5;
                if (hammerAnim.progress < 0.45) {
                    // 振り下ろす
                    const t = hammerAnim.progress / 0.45;
                    hammerGroup.rotation.z = -0.5 + t * 1.15;
                } else if (hammerAnim.progress < 1.0) {
                    // 跳ね返って戻る
                    const t = (hammerAnim.progress - 0.45) / 0.55;
                    hammerGroup.rotation.z = 0.65 - t * 0.8;
                } else {
                    hammerAnim.active = false;
                    hammerGroup.visible = false;
                }
            }

            // 5. 星パーティクルのアニメーション
            for (let i = starParticles.length - 1; i >= 0; i--) {
                const s = starParticles[i];
                s.position.x += s.userData.vx;
                s.position.y += s.userData.vy;
                s.position.z += s.userData.vz;
                s.userData.vz -= 0.003;
                s.rotation.x += 0.15;
                s.rotation.y += 0.15;
                s.userData.life--;
                if (s.userData.life <= 0) {
                    boardGroup.remove(s);
                    starParticles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // 起動時初期化
        window.onload = function() {
            init3D();
            renderSettingsModalUI();

            // ✨ もういっかい！ボタン
            document.getElementById('reset-btn').addEventListener('click', () => {
                resetGame();
            });

            // ⚙️ せっていモーダル開閉
            const settingsModal = document.getElementById('settings-modal');
            const openSettings = () => {
                isSettingsOpen = true;
                sound.playPopUp();
                renderSettingsModalUI();
                settingsModal.classList.remove('hidden');
            };
            const closeSettings = () => {
                isSettingsOpen = false;
                sound.playPopUp();
                settingsModal.classList.add('hidden');
            };

            document.getElementById('settings-btn').addEventListener('click', openSettings);
            document.getElementById('close-settings-btn').addEventListener('click', closeSettings);
            document.getElementById('ok-settings-btn').addEventListener('click', closeSettings);
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) closeSettings();
            });

            // おと ON/OFF トグル
            document.getElementById('setting-sound-btn').addEventListener('click', () => {
                sound.enabled = !sound.enabled;
                if (sound.enabled) sound.playPopUp();
                renderSettingsModalUI();
            });

            animate();
        };
    </script>
</body>
</html>
